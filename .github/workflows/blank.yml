name: KTerm APK Derle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK Oluştur
    runs-on: ubuntu-24.04

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v4

      - name: Gradle 8.7 hazırla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android proje klasörlerini oluştur
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/kortlis/kterm
          mkdir -p app/src/main/res/values

          test -f MainActivity.java
          test -f AndroidManifest.xml
          test -f styles.xml

          cp MainActivity.java \
            app/src/main/java/com/kortlis/kterm/MainActivity.java

          cp AndroidManifest.xml \
            app/src/main/AndroidManifest.xml

          cp styles.xml \
            app/src/main/res/values/styles.xml

      - name: Android uygulama ayarlarını oluştur
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.kortlis.kterm'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.kortlis.kterm'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: APK derle
        run: gradle --no-daemon assembleDebug

      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: KTerm-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
