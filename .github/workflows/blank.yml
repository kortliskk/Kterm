name: KTerm - Gercek Termux APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: KTerm Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: KTerm yapilandirma deposunu al
        uses: actions/checkout@v4

      - name: Resmi Termux uygulama kaynak kodunu al
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: master
          path: upstream

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazirla
        uses: android-actions/setup-android@v4

      - name: Gerekli Android SDK ve NDK paketlerini kur
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;22.1.7171670"

      - name: Uygulama adini KTerm yap
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path("app/src/main/res/values/strings.xml")
          content = strings.read_text(encoding="utf-8")
          old = '<!ENTITY TERMUX_APP_NAME "Termux">'
          new = '<!ENTITY TERMUX_APP_NAME "KTerm">'
          if old not in content:
              raise SystemExit("Termux uygulama adi satiri bulunamadi.")
          strings.write_text(content.replace(old, new, 1), encoding="utf-8")

          gradle = Path("app/build.gradle")
          content = gradle.read_text(encoding="utf-8")
          old = 'manifestPlaceholders.TERMUX_APP_NAME = "Termux"'
          new = 'manifestPlaceholders.TERMUX_APP_NAME = "KTerm"'
          if old not in content:
              raise SystemExit("Gradle uygulama adi ayari bulunamadi.")
          gradle.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Gercek Termux altyapisiyla KTerm APK derle
        working-directory: upstream
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_VERSION_NAME: 0.118.0+kterm.1
          TERMUX_APK_VERSION_TAG: kterm-2.0.0
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
        run: ./gradlew --no-daemon assembleDebug

      - name: Universal APK dosyasini kontrol et
        shell: bash
        run: |
          APK="upstream/app/build/outputs/apk/debug/termux-app_kterm-2.0.0_universal.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: KTerm APK artifact olarak yayinla
        uses: actions/upload-artifact@v4
        with:
          name: KTerm-2.0.0-Universal-APK
          path: upstream/app/build/outputs/apk/debug/termux-app_kterm-2.0.0_universal.apk
          if-no-files-found: error
          retention-days: 14
