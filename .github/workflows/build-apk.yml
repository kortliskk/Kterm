name: KTerm APK Oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Projeyi düzelt
        run: |
          mkdir -p app/src/main/java/com/kortlis/kterm
          mkdir -p app/src/main/res/values
          mv MainActivity.java app/src/main/java/com/kortlis/kterm/
          mv AndroidManifest.xml app/src/main/
          mv styles.xml app/src/main/res/values/
          mv build.gradle app/build.gradle

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

      - name: Android SDK kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KTerm-APK
          path: app/build/outputs/apk/debug/app-debug.apk
