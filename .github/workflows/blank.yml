name: KTerm - Gercek Termux APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: KTerm Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: KTerm yapilandirma deposunu al
        uses: actions/checkout@v4

      - name: Resmi Termux kaynak kodunu al
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: master
          path: upstream

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazirla
        uses: android-actions/setup-android@v4

      - name: Android lisanslarini kabul et
        shell: bash
        run: |
          yes | sdkmanager --licenses

      - name: Resmi Termux gereksinimlerini kur
        working-directory: upstream
        shell: bash
        run: |
          echo "Termux Gradle ayarlari kontrol ediliyor..."
          cat gradle.properties

      - name: Uygulama adini KTerm yap
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path("app/src/main/res/values/strings.xml")
          content = strings.read_text(encoding="utf-8")

          old = '<!ENTITY TERMUX_APP_NAME "Termux">'
          new = '<!ENTITY TERMUX_APP_NAME "KTerm">'

          if old not in content:
              raise SystemExit("Uygulama adi bulunamadi.")

          strings.write_text(
              content.replace(old, new, 1),
              encoding="utf-8"
          )

          gradle = Path("app/build.gradle")
          content = gradle.read_text(encoding="utf-8")

          old = 'manifestPlaceholders.TERMUX_APP_NAME = "Termux"'
          new = 'manifestPlaceholders.TERMUX_APP_NAME = "KTerm"'

          if old not in content:
              raise SystemExit("Gradle uygulama adi ayari bulunamadi.")

          gradle.write_text(
              content.replace(old, new, 1),
              encoding="utf-8"
          )
          PY

      - name: Gradle Wrapper izinlerini ayarla
        working-directory: upstream
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Gercek Termux altyapisiyla KTerm APK derle
        working-directory: upstream
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_VERSION_NAME: 0.118.0+kterm.1
          TERMUX_APK_VERSION_TAG: kterm-2.0.0
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: APK dosyalarini listele
        shell: bash
        run: |
          find upstream/app/build/outputs/apk \
            -type f -name "*.apk" -print

      - name: Universal APK dosyasini kontrol et
        shell: bash
        run: |
          APK="upstream/app/build/outputs/apk/debug/termux-app_kterm-2.0.0_universal.apk"

          if [ ! -s "$APK" ]; then
            echo "Universal APK bulunamadi!"
            echo "Mevcut APK dosyalari:"
            find upstream/app/build/outputs/apk -type f -name "*.apk"
            exit 1
          fi

          ls -lh "$APK"

      - name: KTerm APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: KTerm-2.0.0-Universal-APK
          path: upstream/app/build/outputs/apk/debug/termux-app_kterm-2.0.0_universal.apk
          if-no-files-found: error
          retention-days: 14
